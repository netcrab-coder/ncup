name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 cfnew 最新发布
        id: get_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "正在获取最新发布信息..."
          HTTP_CODE="000"
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/release.json \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/byJoey/cfnew/releases/latest) || HTTP_CODE="000"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            echo "第 ${attempt} 次请求未成功，HTTP 状态码：${HTTP_CODE}"
            cat /tmp/release.json || true
            sleep $((attempt * 10))
          done
          if [ "$HTTP_CODE" != "200" ]; then
            echo "错误：获取最新发布信息失败，HTTP 状态码：${HTTP_CODE}"
            exit 1
          fi
          VERSION=$(jq -r '.tag_name // empty' /tmp/release.json)
          if [ -z "$VERSION" ]; then
            echo "错误：接口返回中没有版本号，返回内容如下："
            cat /tmp/release.json
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "最新版本: $VERSION"
          DOWNLOAD_URL=$(jq -r '.assets[] | select(.name == "Pages.zip") | .browser_download_url // empty' /tmp/release.json | head -1)
          FILE_NAME="Pages.zip"
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "错误：未找到 Pages.zip 文件"
            echo "可用的文件列表："
            jq -r '.assets[].name' /tmp/release.json
            exit 1
          fi
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "下载 URL: $DOWNLOAD_URL"
          echo "文件名: $FILE_NAME"

      - name: 检查当前版本
        id: check_version
        run: |
          if [ ! -f "VERSION.txt" ]; then
            echo "未找到版本记录文件，创建新文件"
            touch VERSION.txt
            CURRENT_VERSION=""
          else
            CURRENT_VERSION=$(cat VERSION.txt | tr -d '\n\r ')
            if [ -z "$CURRENT_VERSION" ]; then
              echo "版本记录文件为空，将进行首次更新"
            else
              echo "当前记录的版本: $CURRENT_VERSION"
            fi
          fi
          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          echo "latest_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            if [ -z "$CURRENT_VERSION" ]; then
              echo "首次运行，将下载文件并创建版本记录"
            else
              echo "发现新版本 $CURRENT_VERSION -> $NEW_VERSION，需要更新"
            fi
            echo "need_update=true" >> $GITHUB_OUTPUT
          else
            echo "版本相同，无需更新"
            echo "need_update=false" >> $GITHUB_OUTPUT
          fi

      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          DOWNLOAD_URL="${{ steps.get_latest.outputs.download_url }}"
          FILE_NAME="${{ steps.get_latest.outputs.file_name }}"
          VERSION="${{ steps.get_latest.outputs.version }}"
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "错误：未找到可下载的文件"
            exit 1
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "错误：未获取到版本号"
            exit 1
          fi
          echo "正在下载文件: $FILE_NAME"
          curl -L -o "$FILE_NAME" "$DOWNLOAD_URL"
          if [ ! -f "$FILE_NAME" ]; then
            echo "错误：下载失败"
            exit 1
          fi
          echo "下载成功: $FILE_NAME"
          echo "正在解压缩 $FILE_NAME..."
          unzip -o "$FILE_NAME" -d .
          echo "解压缩成功"
          rm -f "$FILE_NAME"
          echo "已删除压缩文件: $FILE_NAME"
          if [ ! -f "VERSION.txt" ]; then
            echo "创建版本记录文件"
            touch VERSION.txt
          fi
          echo "$VERSION" > VERSION.txt
          echo "版本记录已创建/更新: $VERSION"
          if [ -f "VERSION.txt" ] && [ -s "VERSION.txt" ]; then
            echo "✓ 版本记录文件创建成功"
          else
            echo "✗ 警告：版本记录文件可能未正确创建"
          fi

      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            git push
            echo "已提交并推送更新"
          fi

      - name: 输出摘要
        run: |
          echo "## 同步结果" >> $GITHUB_STEP_SUMMARY
          echo "- 最新版本: ${{ steps.get_latest.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- 当前版本: ${{ steps.check_version.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
            echo "- 状态: ✅ 已更新到新版本" >> $GITHUB_STEP_SUMMARY
            echo "- 下载文件: ${{ steps.get_latest.outputs.file_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 状态: ⏭️ 版本相同，无需更新" >> $GITHUB_STEP_SUMMARY
          fi
